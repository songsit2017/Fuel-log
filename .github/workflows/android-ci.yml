name: Android CI

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop", "main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Restore Firebase Android configuration
        working-directory: native-kotlin
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: |
          test -n "$FIREBASE_ANDROID_CONFIG_BASE64" || (echo "::error::Set FIREBASE_ANDROID_CONFIG_BASE64" && exit 1)
          echo "$FIREBASE_ANDROID_CONFIG_BASE64" | base64 --decode > app/google-services.json

      - name: Generate local.properties
        working-directory: native-kotlin
        run: echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" > local.properties

      - name: Test and build debug APK
        working-directory: native-kotlin
        run: gradle testDebugUnitTest assembleDebug --no-daemon
