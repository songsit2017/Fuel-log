name: Build and release Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FUELLOG_VERSION_NAME: ${{ format('8.0.0-beta.{0}', github.run_number) }}
      FUELLOG_VERSION_CODE: ${{ github.run_number }}
      RELEASE_TAG: ${{ format('v8.0.0-beta.{0}', github.run_number) }}
      FUELLOG_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
      FUELLOG_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
      FUELLOG_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}

    steps:
      - name: Checkout main source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Test web application
        run: npm test

      - name: Install Capacitor
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Generate full Android application
        working-directory: mobile
        run: |
          npm run web:sync
          npx cap add android

      - name: Restore Firebase Android configuration
        working-directory: mobile
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: |
          test -n "$FIREBASE_ANDROID_CONFIG_BASE64" || (echo "::error::Set FIREBASE_ANDROID_CONFIG_BASE64 from the Firebase Android app google-services.json" && exit 1)
          echo "$FIREBASE_ANDROID_CONFIG_BASE64" | base64 --decode > android/app/google-services.json

      - name: Restore release keystore
        working-directory: mobile
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$APK_KEYSTORE_BASE64" ]; then
            echo "$APK_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
            echo "FUELLOG_KEYSTORE_FILE=$PWD/release-keystore.jks" >> "$GITHUB_ENV"
          fi

      - name: Configure Android version, signing and launcher icon
        working-directory: mobile
        run: npm run android:configure

      - name: Build full Android package
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          if [ -n "${FUELLOG_KEYSTORE_FILE:-}" ]; then
            ./gradlew assembleRelease bundleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../../FuelLog-Pro-${FUELLOG_VERSION_NAME}.apk
            cp app/build/outputs/bundle/release/app-release.aab ../../FuelLog-Pro-${FUELLOG_VERSION_NAME}.aab
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../../FuelLog-Pro-${FUELLOG_VERSION_NAME}-TEST.apk
          fi

      - name: Print APK signing certificate fingerprints
        working-directory: mobile
        run: |
          if [ -n "${FUELLOG_KEYSTORE_FILE:-}" ]; then
            keytool -list -v -keystore "$FUELLOG_KEYSTORE_FILE" -storepass "$FUELLOG_KEYSTORE_PASSWORD" -alias "$FUELLOG_KEY_ALIAS" | grep -E "SHA1:|SHA256:"
          else
            keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E "SHA1:|SHA256:"
          fi

      - name: Upload APK/AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: FuelLog-Pro-Android-${{ env.FUELLOG_VERSION_NAME }}
          path: |
            FuelLog-Pro-*.apk
            FuelLog-Pro-*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK/AAB and change details to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_assets=(FuelLog-Pro-*.apk)
          if compgen -G "FuelLog-Pro-*.aab" > /dev/null; then
            release_assets+=(FuelLog-Pro-*.aab)
          fi
          gh release create "$RELEASE_TAG" "${release_assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "FuelLog Pro ${FUELLOG_VERSION_NAME}" \
            --notes "สร้างอัตโนมัติจาก commit ${GITHUB_SHA} ([ดู workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}))" \
            --generate-notes \
            --prerelease

  cleanup:
    name: Delete old workflow runs
    runs-on: ubuntu-latest
    needs: android
    if: always()
    permissions:
      actions: write
      contents: write
    steps:
      - name: Keep only latest 3 runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 3
      - name: Delete older releases and tags
        uses: dev-drprasad/delete-older-releases@v0.3.3
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
