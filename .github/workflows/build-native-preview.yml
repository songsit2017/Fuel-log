name: Build Native Kotlin Preview

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "native-kotlin/**"
      - ".github/workflows/build-native-preview.yml"

permissions:
  contents: write

concurrency:
  group: native-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FUELLOG_VERSION_NAME: ${{ format('9.0.0-native-preview.{0}', github.run_number) }}
      FUELLOG_VERSION_CODE: ${{ github.run_number }}
      RELEASE_TAG: ${{ format('v9.0.0-native-preview.{0}', github.run_number) }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Restore Firebase Android configuration
        working-directory: native-kotlin
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: |
          test -n "$FIREBASE_ANDROID_CONFIG_BASE64" || (echo "::error::Set FIREBASE_ANDROID_CONFIG_BASE64" && exit 1)
          echo "$FIREBASE_ANDROID_CONFIG_BASE64" | base64 --decode > app/google-services.json

      - name: Cache debug keystore
        id: cache-debug-keystore
        uses: actions/cache@v4
        with:
          path: native-kotlin/app/debug.keystore
          key: android-debug-keystore-v1

      - name: Generate debug keystore
        if: steps.cache-debug-keystore.outputs.cache-hit != 'true'
        working-directory: native-kotlin/app
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Generate local.properties
        working-directory: native-kotlin
        run: echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" > local.properties

      - name: Test and build native preview
        working-directory: native-kotlin
        run: gradle testDebugUnitTest assembleDebug --no-daemon

      - name: Print debug keystore SHA-1 / SHA-256
        working-directory: native-kotlin/app
        run: |
          echo "Register these fingerprints for com.songsit.fuellogpro in the Firebase console (Project settings > Your apps) so Google Sign-In works on preview builds:"
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android

      - name: Prepare preview APK
        working-directory: native-kotlin
        run: cp app/build/outputs/apk/debug/app-debug.apk ../FuelLog-Pro-${FUELLOG_VERSION_NAME}.apk

      - name: Upload native preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: FuelLog-Pro-Native-Preview-${{ env.FUELLOG_VERSION_NAME }}
          path: FuelLog-Pro-*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish native preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" FuelLog-Pro-*.apk \
            --target "$GITHUB_SHA" \
            --title "FuelLog Pro Native Preview ${FUELLOG_VERSION_NAME}" \
            --notes "Native Kotlin Preview สำหรับทดสอบเท่านั้น ยังไม่แทน Stable APK ([ดู workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}))" \
            --generate-notes \
            --prerelease

  cleanup:
    name: Delete old workflow runs
    runs-on: ubuntu-latest
    needs: native-preview
    if: always()
    permissions:
      actions: write
    steps:
      - name: Keep only latest 3 runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 3
