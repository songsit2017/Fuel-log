name: Build Native Kotlin Stable Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name (semver, e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      changelog:
        description: "What's new in this version (shown in the GitHub release and the app's in-app changelog)"
        required: true

permissions:
  contents: write

jobs:
  native-release:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FUELLOG_VERSION_NAME: ${{ github.event.inputs.version }}
      RELEASE_TAG: ${{ format('v{0}', github.event.inputs.version) }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute version code
        # Shared across ALL native-kotlin workflows (preview + stable release) so it only ever
        # goes up, regardless of which workflow's own run_number produced the last install —
        # a per-workflow run_number caused this stable release to look like a downgrade to Android
        # after a preview build with a higher run_number had been installed.
        run: echo "FUELLOG_VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Restore Firebase Android configuration
        working-directory: native-kotlin
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: |
          test -n "$FIREBASE_ANDROID_CONFIG_BASE64" || (echo "::error::Set FIREBASE_ANDROID_CONFIG_BASE64" && exit 1)
          echo "$FIREBASE_ANDROID_CONFIG_BASE64" | base64 --decode > app/google-services.json

      - name: Restore release keystore
        working-directory: native-kotlin
        env:
          FUELLOG_KEYSTORE_BASE64: ${{ secrets.FUELLOG_KEYSTORE_BASE64 }}
        run: |
          test -n "$FUELLOG_KEYSTORE_BASE64" || (echo "::error::Set FUELLOG_KEYSTORE_BASE64" && exit 1)
          echo "$FUELLOG_KEYSTORE_BASE64" | base64 --decode > app/fuellog-release.keystore

      - name: Generate local.properties
        working-directory: native-kotlin
        run: echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" > local.properties

      - name: Verify Firebase login certificate
        working-directory: native-kotlin
        env:
          FUELLOG_KEYSTORE_PASSWORD: ${{ secrets.FUELLOG_KEYSTORE_PASSWORD }}
          FUELLOG_KEY_ALIAS: ${{ secrets.FUELLOG_KEY_ALIAS }}
        run: |
          RELEASE_SHA1="$(
            keytool -list -v \
              -keystore app/fuellog-release.keystore \
              -storepass "$FUELLOG_KEYSTORE_PASSWORD" \
              -alias "$FUELLOG_KEY_ALIAS" \
            | sed -n 's/^[[:space:]]*SHA1: //p' \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]'
          )"
          test -n "$RELEASE_SHA1" || (echo "::error::Could not read SHA-1 from the release keystore" && exit 1)
          jq -e \
            --arg package_name "com.songsit.fuellogpro" \
            --arg release_sha1 "$RELEASE_SHA1" \
            'any(.client[];
              .client_info.android_client_info.package_name == $package_name and
              any(.oauth_client[]?;
                .client_type == 1 and
                (.android_info.certificate_hash | ascii_downcase) == $release_sha1
              )
            )' \
            app/google-services.json \
            || (echo "::error::Firebase config does not contain the release signing SHA-1 ($RELEASE_SHA1)" && exit 1)

      - name: Test and build release APK
        working-directory: native-kotlin
        env:
          FUELLOG_KEYSTORE_FILE: fuellog-release.keystore
          FUELLOG_KEYSTORE_PASSWORD: ${{ secrets.FUELLOG_KEYSTORE_PASSWORD }}
          FUELLOG_KEY_ALIAS: ${{ secrets.FUELLOG_KEY_ALIAS }}
          FUELLOG_KEY_PASSWORD: ${{ secrets.FUELLOG_KEY_PASSWORD }}
        run: gradle testDebugUnitTest assembleRelease --no-daemon

      - name: Prepare release APK
        working-directory: native-kotlin
        run: cp app/build/outputs/apk/release/app-release.apk ../FuelLog-Pro-${FUELLOG_VERSION_NAME}.apk

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: FuelLog-Pro-${{ env.FUELLOG_VERSION_NAME }}
          path: FuelLog-Pro-*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "FuelLog Pro ${{ env.FUELLOG_VERSION_NAME }}"
          body: |
            ## FuelLog Pro ${{ env.FUELLOG_VERSION_NAME }} — Stable Release

            ## มีอะไรใหม่ในเวอร์ชันนี้
            ${{ github.event.inputs.changelog }}

            **ฟีเจอร์หลัก**
            - บันทึกการเติมน้ำมัน คำนวณอัตราสิ้นเปลืองและค่าใช้จ่ายอัตโนมัติ
            - สแกนใบเสร็จ/มาตรวัดระยะทางด้วยกล้อง (Claude OCR + fallback on-device)
            - บันทึกทริปพร้อม GPS tracking แยกแท็บ
            - แผนที่ปั๊มน้ำมันใกล้เคียงแบบเต็มจอ พร้อมราคาตามแบรนด์
            - บันทึกค่าบำรุงรักษา/ค่าใช้จ่ายอื่น ๆ พร้อมรูปแนบ
            - สถิติและกราฟสรุปการใช้งานยานพาหนะ
            - นำเข้าข้อมูลจาก Fuelio

            ([ดู workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))

            ---

            <!-- versionCode: ${{ env.FUELLOG_VERSION_CODE }} -->
          prerelease: false
          generate_release_notes: true
          files: FuelLog-Pro-*.apk
