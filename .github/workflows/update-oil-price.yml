name: Update oil prices

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: update-oil-prices
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fetch official Bangchak price data
        run: python scripts/update_oil_price.py
      - name: Commit updated data
        run: |
          if git diff --quiet -- oil-prices.json; then
            echo "No price change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oil-prices.json
          git commit -m "chore: update oil prices"
          git push
