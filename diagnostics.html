<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FuelLog Diagnostics</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:auto;padding:24px;background:#0b1220;color:#eef3ff}.card{background:#121d31;border:1px solid #263752;border-radius:18px;padding:18px;margin:12px 0}.ok{color:#58d6a9}.bad{color:#ff7a8a}code{word-break:break-all}</style></head><body><h1>FuelLog Pro v3.9 Diagnostics</h1><div id="results"></div><script type="module">const files=['index.html','app.css','app.js','addons/minimal-pro.css','addons/firebase-config.js','addons/family-pro.js','manifest.json','sw.js'];const out=document.querySelector('#results');for(const f of files){const el=document.createElement('div');el.className='card';try{const r=await fetch('./'+f+'?t='+Date.now(),{cache:'no-store'});el.innerHTML=`<b class="${r.ok?'ok':'bad'}">${r.ok?'✓':'✕'} ${f}</b><div>HTTP ${r.status}</div>`}catch(e){el.innerHTML=`<b class="bad">✕ ${f}</b><div>${e.message}</div>`}out.appendChild(el)}const c=document.createElement('div');c.className='card';c.innerHTML='<b>Firebase Config</b><div id="fb">กำลังตรวจ…</div>';out.appendChild(c);try{const {firebaseConfig}=await import('./addons/firebase-config.js?t='+Date.now());document.querySelector('#fb').innerHTML=`<span class="ok">✓ ${firebaseConfig.projectId}</span>`}catch(e){document.querySelector('#fb').innerHTML=`<span class="bad">✕ ${e.message}</span>`}</script></body></html>
