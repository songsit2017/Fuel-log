<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>FuelLog Pro</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css?v=5.0.0">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow" id="pageEyebrow">รถของฉัน</div>
      <h1 id="pageTitle">ภาพรวม</h1>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="สลับธีม">◐</button>
  </header>

  <main id="app">
    <section class="page active" data-page="home">
      <div class="vehicle-strip" id="vehicleStrip"></div>
      <article class="hero-card">
        <div>
          <span>อัตราสิ้นเปลืองเฉลี่ย</span>
          <strong id="avgKml">—</strong><em>กม./ลิตร</em>
        </div>
        <div class="health" id="healthScore">—</div>
      </article>
      <div class="metric-grid" id="homeMetrics"></div>
      <article class="card">
        <div class="card-head"><h2>ค่าใช้จ่าย 6 เดือน</h2><span id="trendText"></span></div>
        <svg id="monthlyChart" viewBox="0 0 320 130" aria-label="กราฟค่าใช้จ่าย"></svg>
      </article>
      <article class="card"><div class="card-head"><h2>รายการล่าสุด</h2><button class="text-btn" data-go="fuel">ดูทั้งหมด</button></div><div id="latestList"></div></article>
      <article class="card"><div class="card-head"><h2>ใกล้ถึงกำหนด</h2><button class="text-btn" data-go="maintenance">จัดการ</button></div><div id="dueList"></div></article>
    </section>

    <section class="page" data-page="fuel">
      <div class="section-head"><div><h2>เติมน้ำมัน</h2><p>ประวัติและประสิทธิภาพ</p></div><button class="primary small" id="addFuelBtn">＋ เพิ่ม</button></div>
      <div class="filters"><input id="fuelSearch" placeholder="ค้นหาปั๊ม หมายเหตุ ชนิดน้ำมัน"><select id="fuelPeriod"><option value="all">ทั้งหมด</option><option value="month">เดือนนี้</option><option value="year">ปีนี้</option></select></div>
      <article class="card compact" id="nearbyCard"><div class="card-head"><h2>ปั๊มใกล้ฉัน</h2><button class="text-btn" id="refreshNearby">รีเฟรช</button></div><div id="nearbyList" class="muted">เปิดหน้าเพิ่มรายการเพื่อค้นหาอัตโนมัติ</div></article>
      <div id="fuelList" class="records"></div>
    </section>

    <section class="page" data-page="expense">
      <div class="section-head"><div><h2>ค่าใช้จ่าย</h2><p>ซ่อม ประกัน ภาษี และค่าใช้จ่ายอื่น</p></div><button class="primary small" id="addExpenseBtn">＋ เพิ่ม</button></div>
      <div class="filters"><input id="expenseSearch" placeholder="ค้นหารายการหรือหมวด"><select id="expensePeriod"><option value="all">ทั้งหมด</option><option value="month">เดือนนี้</option><option value="year">ปีนี้</option></select></div>
      <div class="metric-grid" id="expenseMetrics"></div>
      <div id="expenseList" class="records"></div>
    </section>

    <section class="page" data-page="maintenance">
      <div class="section-head"><div><h2>บำรุงรักษา</h2><p>เตือนตามเลขไมล์และวันที่</p></div><button class="primary small" id="addReminderBtn">＋ เพิ่ม</button></div>
      <div id="maintenanceList" class="records"></div>
    </section>

    <section class="page" data-page="more">
      <div class="menu-list">
        <button data-panel="family"><span>👨‍👩‍👧‍👦</span><div><b>ครอบครัวและ Cloud</b><small>ล็อกอิน แชร์รถ และซิงก์ข้อมูล</small></div><i>›</i></button>
        <button data-panel="trips"><span>🛣️</span><div><b>ทริปและหน้างาน</b><small>ค่าน้ำมัน ทางด่วน ที่จอด และต้นทุนงาน</small></div><i>›</i></button>
        <button data-panel="gallery"><span>📷</span><div><b>รูปและเอกสาร</b><small>ใบเสร็จ เรือนไมล์ งานซ่อม และเอกสารรถ</small></div><i>›</i></button>
        <button data-panel="reports"><span>📊</span><div><b>รายงาน</b><small>สรุป กม./ลิตร บาท/กม. และค่าใช้จ่าย</small></div><i>›</i></button>
        <button data-panel="backup"><span>💾</span><div><b>สำรองและนำเข้า</b><small>JSON, CSV และ Fuelio</small></div><i>›</i></button>
        <button data-panel="vehicles"><span>🚗</span><div><b>จัดการรถ</b><small>เพิ่ม แก้ไข และเลือกรถ</small></div><i>›</i></button>
      </div>
      <div id="panelHost"></div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="active" data-nav="home"><span>⌂</span>หน้าหลัก</button>
    <button data-nav="fuel"><span>⛽</span>เติมน้ำมัน</button>
    <button data-nav="expense"><span>฿</span>ค่าใช้จ่าย</button>
    <button data-nav="maintenance"><span>🔧</span>บำรุง</button>
    <button data-nav="more"><span>•••</span>เพิ่มเติม</button>
  </nav>

  <dialog id="formDialog"><form method="dialog" id="dynamicForm"><header><h2 id="formTitle"></h2><button value="cancel" class="icon-btn">×</button></header><div id="formBody"></div><footer><button value="cancel" class="secondary">ยกเลิก</button><button value="default" class="primary" id="formSave">บันทึก</button></footer></form></dialog>
  <dialog id="panelDialog"><div class="dialog-wrap"><header><h2 id="panelTitle"></h2><button class="icon-btn" id="closePanel">×</button></header><div id="panelBody"></div></div></dialog>
  <div id="toast"></div>

  <script type="module" src="app.js?v=5.0.0"></script>
</body>
</html>
